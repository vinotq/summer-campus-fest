services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      DB_FILE: /data/db.sqlite
      UPLOADS_DIR: /data/uploads
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 1g
    cpus: 0.9

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    volumes:
      - ./web-dist:/var/www/web
    depends_on:
      - app
