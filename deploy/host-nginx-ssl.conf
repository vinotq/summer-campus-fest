# Хостовой nginx, TLS для captcha.sirius-campus.ru.
# Кладётся в /etc/nginx/captcha-ssl/captcha.conf ПОСЛЕ выпуска сертификата.

server {
  # На VPS nginx 1.18 (Ubuntu 22.04): директива `http2 on;` появилась только
  # в 1.25.1 и здесь уронит `nginx -t`, а вместе с ним — reload для ВСЕХ
  # сайтов на машине. Синтаксис обязан быть старым.
  listen 443 ssl http2;
  server_name captcha.sirius-campus.ru;
  client_max_body_size 6m;

  ssl_certificate     /etc/letsencrypt/live/captcha.sirius-campus.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/captcha.sirius-campus.ru/privkey.pem;

  # TLS 1.3 ClientHello режется DPI в РФ-сетях, соединения рвутся через раз —
  # проверено на sirius-eviction. Не возвращать 1.3 без проверки на месте.
  ssl_protocols TLSv1.2;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:captchaSSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Ни камера, ни микрофон, ни геопозиция игре не нужны: аудио-капча только
  # воспроизводит записанный файл, ничего не записывая.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # Инлайновых скриптов в сборке Vite нет, поэтому script-src строгий.
  # style-src 'unsafe-inline' вынужденно: интерфейс написан на inline-стилях
  # в JSX, и почти каждый элемент несёт атрибут style.
  # img-src blob: нужен предпросмотру кадрирования в админке, а шрифты Onest
  # и JetBrains Mono приезжают с Google Fonts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Вход администратора — главная цель перебора и самый дорогой эндпоинт
  # (проверка пароля через scrypt).
  location = /api/admin/login {
    limit_req  zone=captcha_login_rl burst=20 nodelay;
    limit_conn captcha_conn 40;
    proxy_pass http://127.0.0.1:8084;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Постоянные соединения табло и страницы игры. Буферизацию выключаем,
  # иначе события копятся в nginx и до браузера не доходят, а таймаут
  # поднимаем до часа: дефолтная минута рвёт соединение на каждой паузе.
  location /socket.io/ {
    limit_conn captcha_conn 250;
    proxy_pass http://127.0.0.1:8084;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req  zone=captcha_api_rl burst=200 nodelay;
    limit_conn captcha_conn 200;
    proxy_pass http://127.0.0.1:8084;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    limit_req  zone=captcha_api_rl burst=200 nodelay;
    limit_conn captcha_conn 250;
    proxy_pass http://127.0.0.1:8084;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
