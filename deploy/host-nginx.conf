# Хостовой nginx, порт 80 для captcha.sirius-campus.ru.
# Кладётся в /etc/nginx/sites-available/captcha (см. SETUP.md).
#
# ВАЖНО: на этом VPS уже живут sirius-eviction (у него default_server на :80),
# «Старт», ЛКП и concur. Здесь default_server НЕ указываем — иначе один из
# сайтов перестанет отвечать, а nginx -t об этом не предупредит.

# Имена зон с префиксом captcha_: зоны sirius-eviction (api_rl, login_rl,
# conn_lim) и «Старта» (start_*) уже объявлены в http-контексте, дубль уронит
# nginx -t, а вместе с ним reload для всех сайтов машины.
#
# Пределы намеренно высокие. Весь кампус выходит в интернет одним адресом,
# а капчу на станции проходят десятками одновременно с одной точки — обычные
# «2r/s на адрес» здесь означают не защиту от перебора, а отказ в обслуживании
# всей очереди. Точный лимит на игрока делает приложение (три попытки на имя),
# здесь только грубая сетка от флуда извне.
limit_req_zone  $binary_remote_addr zone=captcha_api_rl:10m   rate=100r/s;
# Вход администратора — единственное место, где перебор осмыслен и где за
# адресом не стоит толпа: организаторов единицы, а не сотни.
limit_req_zone  $binary_remote_addr zone=captcha_login_rl:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=captcha_conn:10m;

server {
  listen 80;
  server_name captcha.sirius-campus.ru;
  client_max_body_size 6m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Более специфичный префикс выигрывает у `location /`, поэтому проверка
  # certbot проходит по HTTP и при включённом редиректе — комментировать
  # его на время выпуска сертификата не нужно.
  location / {
    return 301 https://$host$request_uri;
  }
}

# TLS-сервер подключается после выпуска сертификата.
# Каталог пуст до certbot — wildcard на пустом каталоге nginx не ломает.
include /etc/nginx/captcha-ssl/*.conf;
