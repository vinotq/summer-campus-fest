worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  client_max_body_size 6m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Адрес клиента приходит от хостового nginx, который и держит TLS. Без этого
  # в журнале и в приложении у всех был бы один адрес докер-моста.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream app { server app:3000; }

  server {
    listen 80;
    # Домен проверяет хостовой nginx; сюда доходит только то, что он прислал.
    server_name _;

    root /var/www/web;
    index index.html;

    # Vite кладёт хеш в имя файла — такие ассеты можно кешировать навсегда.
    location /assets/ {
      # Один заголовок, а не `expires` плюс `add_header`: вместе они дают
      # два разных Cache-Control в одном ответе.
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html кешировать нельзя: в нём ссылки на хешированные ассеты, и
    # закешированный старый index после выкладки тянул бы исчезнувшие файлы.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    # Загруженные к вопросам картинки и аудио — отдаёт nginx напрямую.
    location /uploads/ {
      alias /var/www/uploads/;
      add_header Cache-Control "public, max-age=2592000, immutable";
      add_header X-Content-Type-Options "nosniff";
    }

    location /api/ {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Табло и страница игры держат постоянное соединение. Таймаут на час:
    # дефолтные 60 секунд рвали бы его на каждой паузе между вопросами.
    location /socket.io/ {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 1h;
    }

    # SPA: любой неизвестный путь отдаёт index.html, роутинг делает React.
    # Объявлен последним намеренно — более специфичные префиксы выше.
    location / {
      try_files $uri /index.html;
    }
  }
}
